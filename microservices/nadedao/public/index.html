<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>拿得到</title>
  <meta name="description" content="用城市通的實名資料，找出你和家人可能符合的補助，並由代理人協助申請與領取。">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <main id="view" tabindex="-1" aria-live="polite">
    <div class="page"><p class="muted">拿得到載入中…</p></div>
  </main>

  <!-- 開機診斷：程式沒在 8 秒內啟動，或載入出錯時，直接在畫面上顯示原因（避免白畫面看不出問題） -->
  <script>
    (function () {
      var errors = [];
      function show(title) {
        if (window.__nadedaoStarted) return;
        var view = document.getElementById('view');
        var esc = function (s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); };
        view.innerHTML = '<div class="page"><div class="banner danger"><strong>' + esc(title) + '</strong>' +
          '<p>' + (errors.length ? esc(errors.join('；')) : '沒有收到錯誤訊息，可能是網路太慢或連不到伺服器。') + '</p>' +
          '<p class="small">' + esc(navigator.userAgent) + '</p></div>' +
          '<button type="button" class="btn block" onclick="location.reload()">重新載入</button></div>';
      }
      window.addEventListener('error', function (e) {
        errors.push((e.message || (e.target && (e.target.src || e.target.href)) || '資源載入失敗'));
        if (!window.__nadedaoStarted) show('拿得到無法啟動');
      }, true);
      window.addEventListener('unhandledrejection', function (e) { errors.push(String(e.reason && e.reason.message || e.reason)); });
      setTimeout(function () { show('載入時間過長'); }, 8000);
    })();
  </script>

  <nav class="tabbar" aria-label="主要功能">
    <a href="#/" data-tab="home">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11h16v8.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19.5V11Z"/><path d="M3 8a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v3H3V8Z"/><path d="M12 7v14"/><path d="M12 7S10.5 3 8.3 3.8C6.5 4.4 7.5 7 12 7Zm0 0s1.5-4 3.7-3.2C17.5 4.4 16.5 7 12 7Z"/></svg>補助</a>
    <a href="#/family" data-tab="family">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c0-3.3 2.5-5.6 5.5-5.6s5.5 2.3 5.5 5.6"/><circle cx="17" cy="9.5" r="2.4"/><path d="M15.5 14.6c.5-.1 1-.2 1.5-.2 2.4 0 4 1.9 4 4.6"/></svg>家人與代理</a>
    <a href="#/notices" data-tab="notices">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16.5V11a6 6 0 1 1 12 0v5.5l1.5 2H4.5l1.5-2Z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>通知</a>
  </nav>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="./vendor/qrcode.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
