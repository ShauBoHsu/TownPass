<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>分類模型測試</title>
  <style>
    :root {
      --primary-50: #edf8fa;
      --primary-500: #5ab4c5;
      --primary-700: #3b8c9c;
      --secondary-50: #fef6e7;
      --secondary-500: #f5ba4b;
      --red-500: #d9534f;
      --gray-50: #f1f3f4;
      --gray-200: #c9d1d6;
      --gray-500: #738995;
      --gray-800: #2e3a40;
      --white: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--gray-50);
      color: var(--gray-800);
      font-family: "PingFang TC", "Noto Sans TC", Roboto, system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    main { padding: 16px; display: grid; gap: 12px; max-width: 560px; margin: 0 auto; }
    section { background: var(--white); border: 1px solid var(--gray-200); border-radius: 12px; padding: 16px; }
    h2 { margin: 0 0 8px; font-size: 18px; }
    label { display: block; margin: 8px 0 6px; color: var(--gray-500); }
    select, textarea {
      width: 100%; font: inherit; font-size: 16px; color: inherit;
      border: 1px solid var(--gray-200); border-radius: 8px; padding: 10px; background: var(--white);
    }
    textarea { min-height: 88px; resize: vertical; }
    button {
      min-height: 48px; width: 100%; margin-top: 10px; border: 0; border-radius: 8px;
      background: var(--primary-500); color: var(--white); font: inherit; font-size: 16px; cursor: pointer;
    }
    button:disabled { background: var(--gray-200); cursor: not-allowed; }
    button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--secondary-500); outline-offset: 2px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .chip {
      width: auto; min-height: 40px; margin: 0; padding: 0 12px; border-radius: 999px;
      background: var(--primary-50); color: var(--primary-700); font-size: 14px;
    }
    .status { color: var(--gray-500); font-size: 12px; white-space: pre-line; }
    .bar { height: 6px; background: var(--gray-50); border-radius: 3px; overflow: hidden; margin-top: 8px; }
    .bar > div { height: 100%; width: 0; background: var(--primary-500); transition: width .2s; }
    .decision { padding: 12px; border-radius: 8px; background: var(--primary-50); margin-bottom: 12px; }
    .decision.warn { background: var(--secondary-50); }
    .decision.danger { background: #fbe9e8; color: var(--red-500); }
    .decision strong { display: block; font-size: 16px; }
    ol { margin: 0; padding-left: 20px; display: grid; gap: 10px; }
    .score { float: right; font-variant-numeric: tabular-nums; color: var(--gray-500); }
    .meta { color: var(--gray-500); font-size: 12px; }
    .empty { color: var(--gray-500); }
  </style>
</head>
<body>
  <main>
    <section aria-labelledby="h-model">
      <h2 id="h-model">設定</h2>
      <label for="catalog">分類器</label>
      <select id="catalog">
        <option value="townpass">城市通功能導航（31 類）</option>
        <option value="dispatch">市政陳情分派（11 類）</option>
      </select>
      <label for="model">embedding 模型（在這支手機上執行）</label>
      <select id="model">
        <option value="minilm">paraphrase-multilingual-MiniLM-L12-v2（q8，推薦）</option>
        <option value="e5">multilingual-e5-small（q8）</option>
      </select>
      <div class="bar" aria-hidden="true"><div id="bar"></div></div>
      <p id="status" class="status" role="status">準備中…</p>
      <button id="retry" type="button" hidden>重新載入模型</button>
    </section>

    <section aria-labelledby="h-input">
      <h2 id="h-input">輸入</h2>
      <label for="text">用一般說話的方式描述你的需求</label>
      <textarea id="text" placeholder="例如：附近有沒有哺乳室"></textarea>
      <button id="run" type="button" disabled>判斷</button>
      <div class="chips" id="samples" aria-label="測試範例"></div>
    </section>

    <section aria-labelledby="h-output">
      <h2 id="h-output">輸出</h2>
      <div id="output" aria-live="polite"><p class="empty">尚未判斷</p></div>
    </section>
  </main>

  <script type="module">
    // +esm：jsdelivr 會把 onnxruntime-web 等相依套件改寫成 CDN 網址，瀏覽器才能直接載入
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.2/+esm';

    env.allowLocalModels = false;
    // 模型改從同網域的 /hf/ 代理下載（避開 CORS），下載後存在瀏覽器快取，離線可用
    env.remoteHost = `${location.origin}/hf/`;

    const MODELS = {
      minilm: { id: 'Xenova/paraphrase-multilingual-MiniLM-L12-v2', prefix: '', confident: 0.05 },
      e5: { id: 'Xenova/multilingual-e5-small', prefix: 'query: ', confident: 0.015 },
    };
    const CATALOGS = {
      townpass: {
        file: './townpass-catalog.json', field: 'target', verb: '建議開啟',
        samples: ['我要申請低收入戶證明', '小孩要換尿布附近有地方嗎', '牌照稅的單子要在哪裡繳', '想帶小孩去看無尾熊',
          '城市通打開就當掉', '我的機車停在樓下不見了', '颱風過後高麗菜變多貴', '有新的補助消息時提醒我'],
      },
      dispatch: {
        file: './catalog.json', field: 'agency', verb: '建議分派',
        samples: ['巷口那盞燈晚上都不亮', '隔壁鐵皮屋燒起來了快來', '樓上每天晚上跳來跳去吵到睡不著',
          '我車子被別人的車堵住開不出去', '打開水龍頭都沒有水', '上次借的小說可以再延長嗎',
          '老人家要打流感那一針', '看到一隻小貓被丟在紙箱裡'],
      },
    };

    const $ = (id) => document.getElementById(id);
    const status = (msg) => { $('status').textContent = msg; };
    const dot = (a, b) => { let s = 0; for (let i = 0; i < a.length; i++) s += a[i] * b[i]; return s; };

    let model = null;     // { key, m, extractor, loadMs }
    let cat = null;       // { key, cfg, items, index, indexMs }
    let busy = false;

    function setBusy(b) {
      busy = b;
      $('run').disabled = b || !model || !cat;
      $('model').disabled = b;
      $('catalog').disabled = b;
    }

    async function ensureModel(key) {
      if (model?.key === key) return;
      const m = MODELS[key];
      const files = {};
      const t0 = performance.now();
      $('bar').style.width = '0';
      status(`載入 ${m.id}…`);
      const extractor = await pipeline('feature-extraction', m.id, {
        dtype: 'q8',
        device: 'wasm',
        progress_callback: (p) => {
          if (p.status === 'progress' && p.total) {
            files[p.file] = { loaded: p.loaded, total: p.total };
            const all = Object.values(files);
            const loaded = all.reduce((s, f) => s + f.loaded, 0);
            const total = all.reduce((s, f) => s + f.total, 0);
            $('bar').style.width = `${(loaded / total) * 100}%`;
            status(`下載模型 ${(loaded / 1e6).toFixed(1)} / ${(total / 1e6).toFixed(1)} MB`);
          }
        },
      });
      $('bar').style.width = '100%';
      model = { key, m, extractor, loadMs: performance.now() - t0 };
      cat = null; // 換模型後範例索引要重建
    }

    async function ensureCatalog(key) {
      if (cat?.key === key && cat.modelKey === model.key) return;
      const cfg = CATALOGS[key];
      status('建立範例索引…');
      const items = await (await fetch(cfg.file)).json();
      const t0 = performance.now();
      const index = [];
      for (const c of items) {
        const out = await model.extractor(c.examples.map((t) => model.m.prefix + t), { pooling: 'mean', normalize: true });
        out.tolist().forEach((v, i) => index.push({ id: c.id, text: c.examples[i], v }));
      }
      cat = { key, modelKey: model.key, cfg, items, index, indexMs: performance.now() - t0 };
      renderSamples();
    }

    async function prepare() {
      setBusy(true);
      $('retry').hidden = true;
      try {
        await ensureModel($('model').value);
        await ensureCatalog($('catalog').value);
        status(`就緒｜模型載入 ${(model.loadMs / 1000).toFixed(1)} 秒、索引 ${(cat.indexMs / 1000).toFixed(1)} 秒（${cat.items.length} 類、${cat.index.length} 句範例）\n${navigator.onLine ? '目前有網路' : '目前離線'}`);
        $('output').innerHTML = '<p class="empty">尚未判斷</p>';
      } catch (e) {
        status(`載入失敗，「判斷」暫時無法使用。\n原因：${e.message}\n請確認網路後按「重新載入模型」`);
        $('retry').hidden = false;
        console.error(e);
      } finally {
        setBusy(false);
      }
    }

    async function classify(text) {
      const t0 = performance.now();
      const out = await model.extractor([model.m.prefix + text], { pooling: 'mean', normalize: true });
      const qv = out.tolist()[0];
      const best = {};
      for (const e of cat.index) {
        const s = dot(qv, e.v);
        if (!best[e.id] || s > best[e.id].score) best[e.id] = { id: e.id, score: s, nearest: e.text };
      }
      const rank = Object.values(best).sort((a, b) => b.score - a.score).slice(0, 3);
      return { rank, ms: performance.now() - t0 };
    }

    // 簡易決策：緊急類別需要關鍵字佐證才直接撥打；信心不足就讓使用者選
    function decide(text, rank) {
      const byId = Object.fromEntries(cat.items.map((c) => [c.id, c]));
      const top = byId[rank[0].id];
      const emergency = byId.emergency;
      if (emergency) {
        const hit = emergency.keywords.filter((k) => text.includes(k));
        if (hit.length) return { cls: 'danger', title: '請直接撥打 119', reason: `提到「${hit.join('、')}」` };
        if (top.id === 'emergency') {
          return { cls: 'danger', title: '可能是緊急狀況', reason: '模型判斷接近緊急情境，但沒有明確關鍵字：顯示「如有危險請撥 119」按鈕，並列出其他選項' };
        }
      }
      const margin = rank[0].score - rank[1].score;
      if (margin >= model.m.confident) {
        return { cls: '', title: `${cat.cfg.verb}：${top.name}`, reason: `${top[cat.cfg.field]}｜最接近範例「${rank[0].nearest}」` };
      }
      return { cls: 'warn', title: '請使用者從下列選項確認', reason: `第 1、2 名差距 ${margin.toFixed(3)}，信心不足` };
    }

    function render(text, rank, ms) {
      const byId = Object.fromEntries(cat.items.map((c) => [c.id, c]));
      const d = decide(text, rank);
      const items = rank.map((r) => {
        const c = byId[r.id];
        return `<li><span class="score">${r.score.toFixed(3)}</span><strong>${c.name}</strong>
          <div class="meta">${c.group ? `${c.group}｜` : ''}${c[cat.cfg.field]}</div>
          <div class="meta">最接近範例：「${r.nearest}」</div></li>`;
      }).join('');
      $('output').innerHTML = `
        <div class="decision ${d.cls}"><strong>${d.title}</strong>${d.reason}</div>
        <ol>${items}</ol>
        <p class="meta">判斷耗時 ${ms.toFixed(0)} ms｜模型 ${model.m.id}</p>`;
    }

    async function run() {
      const text = $('text').value.trim();
      if (!text || !model || !cat || busy) return;
      setBusy(true);
      try {
        const { rank, ms } = await classify(text);
        render(text, rank, ms);
      } catch (e) {
        $('output').innerHTML = `<p>錯誤：${e.message}</p>`;
      } finally {
        setBusy(false);
      }
    }

    function renderSamples() {
      $('samples').replaceChildren(...cat.cfg.samples.map((s) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'chip';
        b.textContent = s;
        b.addEventListener('click', () => { $('text').value = s; run(); });
        return b;
      }));
    }

    $('run').addEventListener('click', run);
    $('text').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); run(); } });
    $('model').addEventListener('change', prepare);
    $('catalog').addEventListener('change', prepare);
    $('retry').addEventListener('click', prepare);

    prepare();
  </script>
</body>
</html>
